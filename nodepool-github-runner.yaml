---
# NodePool for GitHub Actions self-hosted runners.
# References the github-runner UpCloudNodeClass and restricts to the STARTER-4xCPU-8GB plan.
#
# Apply with: kubectl apply -f nodepool-github-runner.yaml
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: github-runner
spec:
  template:
    metadata:
      labels:
        gh-runner: "yes"
    spec:
      nodeClassRef:
        group: karpenter.k8s.upcloud
        kind: UpCloudNodeClass
        name: github-runner
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["STARTER-4xCPU-8GB"]
      # Max node lifetime. Lower (e.g. 24h) for fresher OS on every runner; 720h is the chart default.
      expireAfter: 24h
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
